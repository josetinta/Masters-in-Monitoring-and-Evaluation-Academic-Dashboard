body:before{content:"";position:fixed;inset:0;background:rgba(235,244,253,.35);pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:700px;transform-origin:0 0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;z-index:1}
button,select,input{font-family:inherit;cursor:pointer}
.hd{height:68px;flex:none;display:flex;align-items:stretch;gap:10px}
.crest{width:54px;flex:none;display:flex;align-items:center;justify-content:center}
.crest img,.crest svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(20,53,107,.3))}
.ban{width:350px;flex:none;border-radius:12px;background:linear-gradient(100deg,#14356b,#2c5aa0 70%,#4a7cc4);color:#fff;padding:7px 16px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 16px rgba(20,53,107,.28);border:2px solid #fff;min-width:0}
.ban small{font:600 10px var(--hd);opacity:.85;letter-spacing:.4px}
.ban b{font:700 15px var(--hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{border-radius:12px;background:rgba(255,255,255,.88);border:2px solid var(--line);box-shadow:0 5px 14px rgba(20,53,107,.12);padding:5px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.box>span{font:800 10.5px var(--hd);color:var(--navy);letter-spacing:.4px}
.per{width:166px;flex:none}.per div{display:flex;gap:5px}
.sm{flex:1;border:0;border-radius:7px;padding:5px 2px;font:800 9.5px var(--hd);background:#d5dbe6;color:#46556f}
.sm.on{background:linear-gradient(#2f66b6,#14356b);color:#fff;box-shadow:0 2px 6px rgba(20,53,107,.35)}
.sel{width:290px;flex:none}
.sel select{width:100%;border:1.5px solid var(--line);border-radius:7px;background:#fff;padding:5px 7px;font:800 12px var(--hd);color:var(--navy)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:34px;padding:4px 10px 4px 5px;box-shadow:0 5px 14px rgba(20,53,107,.12)}
.me img.ph{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2.5px solid var(--gold);flex:none}
.me .nm{min-width:0;flex:1}.me .nm b{display:block;font:800 13px var(--hd);color:var(--navy)}.me .nm span{font:700 10px var(--sans);color:var(--mut);white-space:nowrap}
.me .cl{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
.rw{display:flex;gap:3px}
.ib{width:22px;height:22px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;border:0;color:var(--navy);text-decoration:none}
.ib svg{width:12px;height:12px;fill:currentColor}
.lg{border:1px solid var(--line);background:#fff;border-radius:6px;font:800 9px var(--hd);color:var(--navy);padding:3px 5px}.lg.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1.25fr 1.05fr .95fr;gap:9px}
.c{background:rgba(255,255,255,.82);backdrop-filter:blur(2px);border:2px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(20,53,107,.14);display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.c h2{flex:none;font:800 11.5px var(--hd);color:var(--navy);text-align:center;padding:5px 8px;background:linear-gradient(#eaf1fb,#cddbf0);border-bottom:2px solid var(--line);letter-spacing:.25px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{position:relative;flex:1;min-height:0}.cv svg{position:absolute;inset:0;width:100%;height:100%}
.sb{grid-column:1/3;grid-row:1/4;display:flex;flex-direction:column;gap:8px;min-height:0}
.kc{flex:0 0 66px;min-height:0;display:flex;align-items:center;gap:9px;padding:4px 10px;border-radius:14px;background:rgba(255,255,255,.88);border:2px solid var(--line);box-shadow:0 6px 16px rgba(20,53,107,.13);position:relative;overflow:hidden}
.kc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc)}
.kc .ic{width:34px;height:34px;border-radius:50%;background:var(--kc);display:flex;align-items:center;justify-content:center;flex:none;margin-left:3px}
.kc .ic svg{width:18px;height:18px;fill:#fff}
.kc div.tx{min-width:0;flex:1}.kc small{display:block;font:800 9.5px var(--hd);color:var(--mut);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
.kc b{display:block;font:800 22px var(--hd);color:var(--navy);line-height:1.1}
.kc i{font:800 9px var(--sans);font-style:normal;border-radius:8px;padding:1px 6px;margin-top:1px;display:inline-block}
.up{background:#d7f1de;color:#18783a}.dn{background:#fbdada;color:#b32828}

function gauge(i,pct){

  let o='';
  for(let k=0;k<5;k++){const a0=180-36*k-1.5,a1=180-36*(k+1)+1.5,p1=P(R,a0),p2=P(R,a1),p3=P(r0,a1),p4=P(r0,a0);o+=`<path d="M${p1[0]},${p1[1]} A${R},${R} 0 0 1 ${p2[0]},${p2[1]} L${p3[0]},${p3[1]} A${r0},${r0} 0 0 0 ${p4[0]},${p4[1]}Z" fill="${['#f4353a','#fb8c2a','#fbb800','#7cc22c','#2ec24a'][k]}"/>`;}
  const act=Math.min(4,Math.floor(Math.min(pct,99.9)/20));
  for(let k=0;k<5;k++){const f=P(R+rf*1.35,162-36*k);o+=face(k,f[0],f[1],rf,k===act)}
  const a=180-Math.min(pct,100)/100*180,tip=P(R*.96,a),b1=P(R*.1,a+90),b2=P(R*.1,a-90);
  o+=`<polygon points="${tip[0]},${tip[1]} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}" fill="#14356b"/><circle cx="${cx}" cy="${cy}" r="${R*.15}" fill="#14356b"/><circle cx="${cx}" cy="${cy}" r="${R*.085}" fill="#2a64a6"/>`;
  const s=box.querySelector('svg');s.innerHTML=o;s.setAttribute('viewBox',`0 0 ${W} ${H}`);
}
function evo(d){
  const [s,W,H]=prep('svE'),pl=12,pr=12,top=32,bot=H-34,n=9,sl=(W-pl-pr)/n,mx=Math.max(...d.cand)*1.16,Y=v=>top+(1-v/mx)*(bot-top),bw=Math.min(sl*.52,26),nm=t('co')[cur].split(' – ');
  let o=`<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf4a"/><stop offset="1" stop-color="#d9a313"/></linearGradient></defs><text x="${W/2}" y="18" text-anchor="middle" font-family="Poppins,sans-serif" font-size="11.500" font-weight="700" fill="#14356b">${nm[0].toUpperCase()} – ${(nm[1]||'').toUpperCase()}</text><line x1="${pl}" y1="${bot}" x2="${W-pr}" y2="${bot}" stroke="#a9b6cf"/>`;
  const pts=[];
  d.mat.forEach((v,i)=>{const cx=pl+sl*(i+.5),y=Y(v);o+=`<g><title>${YRS[i]} · ${t('lm')} ${v}</title><rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${bot-y}" rx="2" fill="url(#gb)"/><text x="${cx}" y="${y+12}" text-anchor="middle" font-size="9.500" font-weight="800" fill="#4a3a06">${v}</text></g><text x="${cx}" y="${bot+13}" text-anchor="middle" font-size="9.500" font-weight="700" fill="#33446a">${YRS[i]}</text>`;pts.push([cx,Y(d.cand[i])])});
  o+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#6a3f9e" stroke-width="2.200" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.800" fill="#6a3f9e"/><text x="${p[0]}" y="${p[1]-6}" text-anchor="middle" font-size="9.500" font-weight="800" fill="#3b1f66">${d.cand[i]}</text>`);
  o+=`<rect x="${W/2-88}" y="${H-11}" width="9" height="7" fill="#e0aa18"/><text x="${W/2-76}" y="${H-4.5}" font-size="8.500" font-weight="800" fill="#4a566d">${t('lm')}</text><line x1="${W/2+10}" y1="${H-7.5}" x2="${W/2+26}" y2="${H-7.5}" stroke="#6a3f9e" stroke-width="2"/><text x="${W/2+30}" y="${H-4.5}" font-size="8.500" font-weight="800" fill="#4a566d">${t('lc')}</text>`;
  s.innerHTML=o;
}
function vag(d){
  const [s,W,H]=prep('svV'),n=4,rh=(H-8)/n,mx=Math.max(...d.vag)*1.18,x0=40;let o=`<defs><linearGradient id="gb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1c43a"/><stop offset="1" stop-color="#c99510"/></linearGradient></defs>`;
  for(let k=0;k<n;k++){const i=3-k,y=4+rh*k,bh=rh*.6,w=(W-x0-36)*d.vag[i]/mx;
   o+=`<g><title>${YRS[5+i]} · ${d.vag[i]}</title><text x="${x0-7}" y="${y+rh*.5+4}" text-anchor="end" font-size="10.500" font-weight="800" fill="#33446a">${YRS[5+i]}</text><rect x="${x0}" y="${y+(rh-bh)/2}" width="${w}" height="${bh}" rx="3" fill="url(#gb2)"/><text x="${x0+w+6}" y="${y+rh*.5+5}" font-size="12.500" font-weight="900" fill="#14356b">${d.vag[i]}</text></g>`}
  s.innerHTML=o;
}
/* termómetro */
function therm(d){
  const [s,W,H]=prep('svT'),sat=d.sat,L=Math.min(4,Math.floor(sat/20)),cols=['#e33a24','#ff8c0a','#fbd024','#62cc2b','#20b83a'],tw=22,tx=26,yT=8,bulbR=Math.min(22,H*.15),yB=H-bulbR*1.9,seg=(yB-yT)/5;
  let o=`<rect x="${tx-3}" y="${yT-3}" width="${tw+6}" height="${yB-yT+10}" rx="${(tw+6)/2}" fill="#fff" stroke="#5b6270" stroke-width="2"/>`;
  for(let k=0;k<5;k++){const y=yT+seg*(4-k),on=k<=L;o+=`<rect x="${tx}" y="${y+(k==4?0:.8)}" width="${tw}" height="${seg-.8}" rx="${k==4?tw/2:0}" fill="${cols[k]}" opacity="${on?1:.2}"/>`}
  o+=`<circle cx="${tx+tw/2}" cy="${yB+bulbR*.6}" r="${bulbR+3}" fill="#fff" stroke="#5b6270" stroke-width="2"/><circle cx="${tx+tw/2}" cy="${yB+bulbR*.6}" r="${bulbR}" fill="#e33a24"/><ellipse cx="${tx+tw/2-bulbR*.3}" cy="${yB+bulbR*.35}" rx="${bulbR*.2}" ry="${bulbR*.3}" fill="#fff" opacity=".7"/>`;
  const my=yB-(yB-yT)*sat/100;o+=`<path d="M${tx+tw+3},${my} l9,-5 v10z" fill="#14356b"/>`;
  for(let k=0;k<=20;k++){const y=yT+(yB-yT)*k/20,mj=k%4==0;o+=`<line x1="${tx+tw+14}" y1="${y}" x2="${tx+tw+14+(mj?15:8)}" y2="${y}" stroke="#555d6b" stroke-width="${mj?1.8:1.2}"/>`}
  const fx=tx+tw+54;for(let k=0;k<5;k++){const y=yT+seg*(4-k)+seg/2;o+=face(4-k,fx,y,k===L?Math.min(13,seg*.45):Math.min(10,seg*.36),false).replace(/(translate\([^)]*\))/,'$1');}
  // faces ordem: topo=verde(4)
  o=o.replace(/<g transform="translate\([^)]*\) scale\([^)]*\)">/g,m=>m);
  const tx2=fx+28;o+=`<text x="${tx2}" y="${H*.42}" font-family="Poppins,sans-serif" font-size="${Math.min(30,(W-tx2)*.34)}" font-weight="800" fill="#14356b">${sat}%</text><text x="${tx2}" y="${H*.42+15}" font-size="10" font-weight="800" fill="#5b6c8f">${t('sat')}</text><rect x="${tx2}" y="${H*.42+23}" width="${Math.min(90,W-tx2-8)}" height="20" rx="10" fill="${cols[L]}"/><text x="${tx2+Math.min(90,W-tx2-8)/2}" y="${H*.42+37}" text-anchor="middle" font-size="11" font-weight="900" fill="${L==2?'#4a3a06':'#fff'}">${t('lv')[L]}</text>`;
  s.innerHTML=o;
}
/* funil */
function funil(d){
  const [s,W,H]=prep('svF'),m4=d.mat.slice(5),c4=d.cand.slice(5);let mat=m4[3],ent,apr;apr=mat+Math.ceil(mat*.12);ent=Math.max(apr+Math.ceil(apr*.1),Math.round(c4[3]*d.er));const cand=Math.max(c4[3],ent+Math.ceil(ent*.1));
  const vals=[cand,ent,apr,mat],cols=['#2c5aa0','#3a7bc8','#e0a817','#2f9e5a'],n=4,rh=(H-6)/n,cx=W*.42,maxw=W*.8,minw=W*.28;
  let o='';const wd=vals.map((v,i)=>minw+(maxw-minw)*v/cand);
  for(let i=0;i<n;i++){const y=3+rh*i,w=wd[i],w2=i<n-1?wd[i+1]:w*.88,gp=2;
   o+=`<g><title>${t('fu')[i]} · ${vals[i]}</title><polygon points="${cx-w/2},${y+gp/2} ${cx+w/2},${y+gp/2} ${cx+w2/2},${y+rh-gp/2} ${cx-w2/2},${y+rh-gp/2}" fill="${cols[i]}"/><polygon points="${cx-w/2},${y+gp/2} ${cx+w/2},${y+gp/2} ${cx+w/2-3},${y+rh*.45} ${cx-w/2+3},${y+rh*.45}" fill="#fff" opacity=".16"/>
   <text x="${cx}" y="${y+rh*.45}" text-anchor="middle" font-size="${Math.min(15,rh*.46)}" font-weight="900" fill="#fff">${vals[i]}</text><text x="${cx}" y="${y+rh*.45+10}" text-anchor="middle" font-size="8.500" font-weight="800" fill="#fff" opacity=".92">${t('fu')[i]}</text>`;
   const r=i?Math.round(vals[i]/vals[i-1]*100):100;o+=`<text x="${W-14}" y="${y+rh*.58}" text-anchor="end" font-size="${Math.min(15,rh*.46)}" font-weight="900" fill="${cols[i]}">${r}%</text><line x1="${cx+wd[i]/2+6}" y1="${y+rh/2}" x2="${W-52}" y2="${y+rh/2}" stroke="#b8c5dc" stroke-dasharray="2 3"/></g>`}
  s.innerHTML=o;
}
/* cronómetros */
function sws(d){
  const [s,W,H]=prep('svW'),n=4,sl=W/n,r=Math.min(sl*.34,(H-44)/2.3),cy=r*1.18+8,col=['#26c2c5','#3a7bc8','#e0a817','#2f9e5a'];let o='';
  d.sw.forEach((m,i)=>{const cx=sl*(i+.5),a=m/60*360,P=(rr,deg)=>[cx+Math.cos((deg-90)*Math.PI/180)*rr,cy+Math.sin((deg-90)*Math.PI/180)*rr],e=P(r*.84,a),f=P(r*.84,0),big=a>180?1:0,c=col[i];
   o+=`<g data-m="${m}"><title>${t('sw')[i]} · ${m} min</title><rect x="${cx-r*.14}" y="${cy-r*1.28}" width="${r*.28}" height="${r*.22}" rx="2" fill="#2d3238"/><rect x="${cx-r*.2}" y="${cy-r*1.34}" width="${r*.4}" height="${r*.1}" rx="2" fill="#2d3238"/>
   <rect x="${cx+r*.82}" y="${cy-r*.98}" width="${r*.2}" height="${r*.3}" rx="2" fill="#2d3238" transform="rotate(40 ${cx+r*.9} ${cy-r*.9})"/><rect x="${cx-r*1.02}" y="${cy-r*.98}" width="${r*.2}" height="${r*.3}" rx="2" fill="#2d3238" transform="rotate(-40 ${cx-r*.9} ${cy-r*.9})"/>
   <circle cx="${cx}" cy="${cy}" r="${r}" fill="#2d3238"/><circle cx="${cx}" cy="${cy}" r="${r*.87}" fill="#fff"/><path d="M${cx},${cy} L${f[0]},${f[1]} A${r*.84},${r*.84} 0 ${big} 1 ${e[0]},${e[1]}Z" fill="${c}"/>`;
   for(let k=0;k<60;k++){const mj=k%15==0,q1=P(r*.84,k*6),q2=P(r*(mj?.64:k%5==0?.72:.78),k*6);o+=`<line x1="${q1[0]}" y1="${q1[1]}" x2="${q2[0]}" y2="${q2[1]}" stroke="#2d3238" stroke-width="${mj?1.8:.6}"/>`}
   const hp=P(r*.7,a);o+=`<line x1="${cx}" y1="${cy}" x2="${hp[0]}" y2="${hp[1]}" stroke="#e23b3b" stroke-width="${Math.max(1.6,r*.07)}" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r*.07}" fill="#2d3238"/>
   <text x="${cx}" y="${cy+r*1.18+14}" text-anchor="middle" font-size="${Math.min(15,sl*.2)}" font-weight="900" fill="${c}">${m}<tspan font-size="8"> min</tspan></text><text x="${cx}" y="${H-4}" text-anchor="middle" font-size="9" font-weight="800" fill="#1f2a44">${t('sw')[i]}</text></g>`});
  s.innerHTML=o;
}
/* perfil */
function perfil(d){
  const [s,W,H]=prep('svP'),r=Math.min(W*.26,H*.19),cx=W/2,cy=r+9,C=2*Math.PI*r,f=d.fem/100;
  let o=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#14356b" stroke-width="${r*.42}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e9b824" stroke-width="${r*.42}" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${cx} ${cy})"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="Poppins,sans-serif" font-size="${r*.46}" font-weight="800" fill="#14356b">${d.fem}%</text>`;
  const ly=cy+r+17;o+=`<rect x="${W*.1}" y="${ly-8}" width="9" height="9" rx="2" fill="#e9b824"/><text x="${W*.1+13}" y="${ly}" font-size="9.500" font-weight="800" fill="#33446a">${t('fem')} ${d.fem}%</text><rect x="${W*.1}" y="${ly+8}" width="9" height="9" rx="2" fill="#14356b"/><text x="${W*.1+13}" y="${ly+16}" font-size="9.500" font-weight="800" fill="#33446a">${t('hom')} ${100-d.fem}%</text>`;
  const by=ly+27,bw=W-20;let x=10;const mc=['#14356b','#3a7bc8','#26c2c5'];
  d.mo.forEach((v,i)=>{const w=bw*v;o+=`<rect x="${x}" y="${by}" width="${w}" height="9" fill="${mc[i]}" ${i==0?'rx="4"':''}/>`;x+=w});
  o+=`<text x="10" y="${H-4}" font-size="8" font-weight="800" fill="#5b6c8f">${t('mo').map((m,i)=>m+' '+Math.round(d.mo[i]*100)+'%').join(' · ')}</text>`;
  s.innerHTML=o;
}
function render(){
  const d=D[cur][sem],m4=d.mat.slice(5),c4=d.cand.slice(5),pc=m4.map((m,i)=>Math.round(m/c4[i]*100));
  $('cn').textContent=t('co')[cur];
  for(let i=0;i<4;i++){$('pc'+i).textContent=pc[i]+'%';$('yp'+i).textContent=YRS[5+i];gauge(i,pc[i])}
  $('ac').textContent=nf(c4.reduce((a,b)=>a+b)/4,2);$('am').textContent=nf(m4.reduce((a,b)=>a+b)/4,2);
  evo(d);vag(d);therm(d);funil(d);sws(d);perfil(d);
  const idle=[0,1,2,3].map(i=>d.vag[i]-m4[i]),avg=pc.reduce((a,b)=>a+b)/4,pavg=(pc[0]+pc[1]+pc[2])/3;
  const dl=(id,cu,pr,good=true,suf='%')=>{const df=pr?Math.round((cu-pr)/pr*100):0,up=df>=0,e=$(id);e.textContent=(up?'▲ ':'▼ ')+Math.abs(df)+suf+' vs '+YRS[7];e.className=(up===good)?'up':'dn'};
  $('k1').textContent=nf(c4[3]);dl('d1',c4[3],c4[2]);$('k2').textContent=nf(m4[3]);dl('d2',m4[3],m4[2]);$('k3').textContent=nf(avg,0)+'%';dl('d3',avg,pavg);$('k4').textContent=nf(idle[3]);dl('d4',idle[3],idle[2],false);
  document.querySelectorAll('[data-i^=k]').forEach((e,i)=>e.textContent=t('k')[i]);
  for(let i=0;i<4;i++){const p=Math.max(0,Math.round((1-m4[i]/d.vag[i])*100));$('op'+i).textContent=p+'%';$('yo'+i).textContent=YRS[5+i];$('ch'+i).style.cssText=`clip-path:inset(${100-p}% 0 0 0)`}
  const rows=[FAC[cur],t('pr')[cur],t('ca')[cur],t('ac'),'MT '+nf(d.fee,2)];
  $('inf').innerHTML=t('r').map((l,i)=>`<div class="ir"><span>${l}</span><b>${rows[i]}</b></div>`).join('');
}
function build(){
  $('gs').innerHTML=[0,1,2,3].map(i=>`<div class="gc"><div class="yp" id="yp${i}"></div><div class="cv" id="gg${i}"><svg></svg></div><div class="pc" id="pc${i}"></div></div>`).join('');
  $('oc').innerHTML=[0,1,2,3].map(i=>`<div class="gc"><div class="yp" id="yo${i}"></div><div class="pp" id="op${i}"></div><div class="chr"><img class="b" src="${CHAIR}"><img id="ch${i}" src="${CHAIR}"></div></div>`).join('');
  $('lgs').innerHTML=['pt','en','fr','es'].map(l=>`<button class="lg" data-l="${l}">${l.toUpperCase()}</button>`).join('');
}
function applyLang(){
  document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>{if(!/^k\d$/.test(e.dataset.i))e.textContent=t(e.dataset.i)});
  $('cs').innerHTML=t('co').map((c,i)=>`<option value="${i}"${i==cur?' selected':''}>${c}</option>`).join('');
  document.querySelectorAll('.lg').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
  try{localStorage.setItem('ib_lang',lang)}catch(e){}
}
function fit(){const st=$('stage');if(innerWidth<900){st.style.cssText='';return}const s=Math.min(innerWidth/1280,innerHeight/700,1.6);st.style.transform=`scale(${s})`;st.style.width=innerWidth/s+'px';st.style.height=innerHeight/s+'px'}
function refresh(){gen();render()}
let IM={logo:LOGO};
function logo(){$('s-logo').innerHTML=`<img src="${IM.logo}">`}
document.addEventListener('click',e=>{
  const b=e.target.closest('.lg');if(b){lang=b.dataset.l;applyLang();render();return}
  const sm=e.target.closest('.sm');if(sm){sem=+sm.dataset.s;document.querySelectorAll('.sm').forEach(x=>x.classList.toggle('on',x===sm));refresh();return}
  if(e.target.closest('#rf')){refresh();return}
  if(e.target.closest('#s-logo')){$('fi').click()}
});
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{IM.logo=r.result;logo()};r.readAsDataURL(f);e.target.value=''};
$('cs').onchange=e=>{cur=+e.target.value;refresh()};
document.addEventListener('keydown',e=>{if(e.key==='F9'){e.preventDefault();refresh()}});
build();logo();gen();applyLang();fit();render();
addEventListener('resize',()=>{fit();render()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
</script></body></html>
